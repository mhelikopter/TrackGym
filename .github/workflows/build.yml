name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List iPhone simulators
        run: xcrun simctl list devices available | grep -E "iPhone" | head -10

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrackGym.xcodeproj \
            -scheme TrackGym \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build

      - name: Test (iOS Simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "iPhone (16 Pro|16|15 Pro|15)" | head -1 | sed -E 's/.*\((.*)\) \(Shutdown.*/\1/')
          if [ -z "$DEST" ]; then
            echo "::error::No suitable iPhone simulator found"
            exit 1
          fi
          echo "Using simulator $DEST"
          xcodebuild test \
            -project TrackGym.xcodeproj \
            -scheme TrackGym \
            -destination "id=$DEST" \
            -configuration Debug \
            -only-testing:TrackGymTests \
            -only-testing:TrackGymUITests/TrackGymUITests/test_appLaunchesAndShowsRootView

  watchos:
    name: watchOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (watchOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrackGym.xcodeproj \
            -scheme 'TrackGym Watch App Watch App' \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            build
